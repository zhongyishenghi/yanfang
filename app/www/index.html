<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<meta name="description" content="易圣验方 · 方剂资料检索。按方名、医家、病名、药味检索名老中医方剂资料。">
<title>易圣验方 · 方剂资料检索</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E7D8B8'/%3E%3Cpath d='M45 9.5 h5.5 l0 45.5 -5.5 -1.4 z' fill='%23D8C6A4' stroke='%232D2822' stroke-width='1.8' stroke-linejoin='round'/%3E%3Crect x='8.5' y='7' width='37' height='50' rx='5.5' fill='%23FDF7EA' stroke='%232D2822' stroke-width='2.6'/%3E%3Cpath d='M16 10.5 V53' stroke='%232D2822' stroke-width='2.2'/%3E%3Cpath d='M19.4 13 V50' stroke='%232D2822' stroke-width='1.1' opacity='.5'/%3E%3Cpath d='M12.6 24 v18' stroke='%232D2822' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M12.6 29 l-2.6 -2 M12.6 34 l2.6 -2 M12.6 39 l-2.6 -2' stroke='%232D2822' stroke-width='1.3' stroke-linecap='round'/%3E%3Crect x='24.5' y='15' width='16' height='34' rx='1.6' fill='none' stroke='%23AF3A28' stroke-width='2.5'/%3E%3Cpath d='M28 22.5 h9 M28 30 h9 M28 37.5 h9' stroke='%23AF3A28' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <img class="seal" src="img/seal.png" srcset="img/seal.png 1x, img/seal@2x.png 2x" alt="" width="34" height="34">
      <span class="brand-text"><b>易圣验方</b><i>方剂资料检索</i></span>
    </div>
    <nav class="nav" id="nav" role="tablist">
      <button role="tab" data-view="search" class="on">检索</button>
      <button role="tab" data-view="index">索引</button>
      <button role="tab" data-view="fav">收藏</button>
      <button role="tab" data-view="about">关于</button>
    </nav>
  </header>

  <div class="body">

    <!-- 检索 -->
    <section class="pane" id="view-search" role="tabpanel">
      <!-- 吸顶工具条：整条要铺满不透明底色，否则滚动时卡片会从圆角和两侧空隙里透出来 -->
      <div class="searchhead" id="searchhead">
        <div class="searchbar" id="searchbar">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
          <input id="q" type="search" placeholder="方名 / 医家 / 病名 / 药味" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="检索方剂">
          <button id="clear" class="clear" hidden aria-label="清空">×</button>
        </div>

        <div class="chips" id="chips" role="group" aria-label="检索维度">
          <button data-type="all" class="on">全部</button>
          <button data-type="name">方名</button>
          <button data-type="doctor">医家</button>
          <button data-type="disease">病名</button>
          <button data-type="herb">药味</button>
        </div>
      </div>

      <div class="meta" id="meta"></div>
      <div class="list" id="list"></div>
    </section>

    <!-- 索引 -->
    <section class="pane" id="view-index" role="tabpanel" hidden>
      <div class="seg" id="seg" role="group" aria-label="索引类别">
        <button data-facet="doctors" class="on">医家</button>
        <button data-facet="groups">病名</button>
        <button data-facet="herbs">药味</button>
      </div>
      <div class="meta" id="facet-meta"></div>
      <div class="facets" id="facets"></div>
    </section>

    <!-- 收藏 -->
    <section class="pane" id="view-fav" role="tabpanel" hidden>
      <div class="meta" id="fav-meta"></div>
      <div class="list" id="fav-list"></div>
    </section>

    <!-- 关于 -->
    <section class="pane" id="view-about" role="tabpanel" hidden>
      <div class="about" id="about"></div>
    </section>

    <!-- 详情 -->
    <section class="detail" id="detail" hidden aria-live="polite"></section>
  </div>

  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lb-close" aria-label="关闭">×</button>
  <div class="lb-body" id="lb-body"></div>
</div>

<script src="js/mode.js"></script>
<script src="js/appver.js"></script>
<script src="js/db.js"></script>
<script src="js/search.js"></script>
<script src="js/update.js"></script>
<script src="js/app.js"></script>
</body>
</html>
